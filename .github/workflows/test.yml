name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      # the committed claude-mod/ must stay in sync with src/ + package.json;
      # regenerate and fail if anything drifted
      - run: npm run gen:claude-mod && git diff --exit-code claude-mod
      # offline regression harness: captured real outputs through the engine
      # (predict.mjs / offcheck.mjs import ../dist, so it must run after build)
      - run: node e2e/predict.mjs && node e2e/offcheck.mjs
